# Render Blueprint: describes the API service so it is created the same way
# every time. Values marked "sync: false" are typed into Render's dashboard
# when the service is created and are never stored in this repository.
services:
  - type: web
    name: eneba-marketplace-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    # Answers without touching the database, so health checks and uptime
    # pings do not keep the free database awake.
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_NAME
        value: Eneba Marketplace
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      # Public address of the frontend, e.g. https://<project>.vercel.app
      # (no trailing slash). Decides who may use the login session and CORS.
      - key: FRONTEND_URL
        sync: false
      # Same value as FRONTEND_URL: it is the address visitors see.
      - key: APP_URL
        sync: false

      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info

      # Database (Neon). The connection is encrypted and the server's
      # certificate is verified against the system's trusted authorities.
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: neondb
      - key: DB_USERNAME
        value: neondb_owner
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: verify-full
      - key: DB_SSLROOTCERT
        value: /etc/ssl/certs/ca-certificates.crt

      # Login session: stored in the database, cookie sent over HTTPS only.
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_LIFETIME
        value: "120"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync

      # The app is behind the frontend host's proxy and Render's load
      # balancer; their forwarded headers say the visitor used HTTPS.
      - key: TRUSTED_PROXIES
        value: "*"

      # Temporary: lets scripts/deploy/verify-deployment.mjs show what the
      # server receives through the proxies. Set to "false" once verified.
      - key: DEPLOY_DIAGNOSTICS
        value: "true"
