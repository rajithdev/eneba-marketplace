# Local development only. The credentials below are throwaway values for a
# database that is reachable only from this machine; production uses its own.
services:
  db:
    # Same major version as the production database (Neon, PostgreSQL 18).
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: eneba
      POSTGRES_PASSWORD: eneba
      POSTGRES_DB: eneba
    ports:
      # Host port 5434, bound to localhost only, so it never clashes with another
      # Postgres on this machine and is not reachable from the network.
      - "127.0.0.1:5434:5432"
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/<version>.
      - db-data-pg18:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eneba -d eneba"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./api
      target: dev
    volumes:
      - ./api:/var/www/html
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data-pg18:
