# Apache site for the production image. The entrypoint replaces the port
# with the one the host provides.

ServerName localhost

# Do not advertise software versions.
ServerTokens Prod
ServerSignature Off

# The free instance has 512 MB of memory. Each Apache worker holds a PHP
# process, so the number of workers is capped well below what would fit.
<IfModule mpm_prefork_module>
    StartServers            2
    MinSpareServers         1
    MaxSpareServers         3
    MaxRequestWorkers       8
    MaxConnectionsPerChild  500
</IfModule>

<VirtualHost *:10000>
    # Only Laravel's public folder is reachable from the web; application
    # code, .env files and storage are outside it.
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes
        # Laravel's public/.htaccess sends every request to index.php.
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
