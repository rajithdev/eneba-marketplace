# Runs the PRODUCTION image locally with production settings, to verify it
# before deploying. Used by scripts/deploy/prod-check.sh ("make prod-check").
# It differs from real production in exactly two ways, both unavoidable on
# one machine: the local database has no TLS, and the address is localhost.
services:
  api-prod:
    build:
      context: ./api
    environment:
      APP_NAME: Eneba Marketplace
      APP_ENV: production
      APP_DEBUG: "false"
      # A throwaway key generated for each run by prod-check.sh.
      APP_KEY: ${PRODCHECK_APP_KEY:?run this through scripts/deploy/prod-check.sh}
      FRONTEND_URL: ${PRODCHECK_FRONTEND_URL:-http://localhost:4780}
      APP_URL: ${PRODCHECK_FRONTEND_URL:-http://localhost:4780}
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: eneba_prodcheck
      DB_USERNAME: eneba
      DB_PASSWORD: eneba
      DB_SSLMODE: disable
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "true"
      SESSION_LIFETIME: "120"
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      TRUSTED_PROXIES: "*"
      DEPLOY_DIAGNOSTICS: "true"
      PORT: "10000"
    ports:
      - "127.0.0.1:${PRODCHECK_API_PORT:-8100}:10000"
    depends_on:
      db:
        condition: service_healthy
