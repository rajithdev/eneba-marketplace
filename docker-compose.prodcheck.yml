# Runs the PRODUCTION image locally to verify it before deploying. Used by
# scripts/deploy/prod-check.sh ("make prod-check"), which writes .env.prodcheck:
# every variable from render.yaml, plus local stand-ins for the values that
# are typed into Render's dashboard. The only differences from real production
# are the ones one machine cannot avoid: a local database without TLS, and a
# localhost address.
services:
  api-prod:
    build:
      context: ./api
    env_file: .env.prodcheck
    environment:
      # Render sets this itself.
      PORT: "10000"
    ports:
      - "127.0.0.1:${PRODCHECK_API_PORT:-8100}:10000"
    depends_on:
      db:
        condition: service_healthy
