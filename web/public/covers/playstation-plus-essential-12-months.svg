<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="PlayStation Plus Essential 12 Months">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(73 70% 32%)"/>
      <stop offset="1" stop-color="hsl(111 75% 14%)"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.35" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.72"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <circle cx="100" cy="495" r="192" fill="hsl(98 80% 65%)" opacity="0.38"/>
  <circle cx="287" cy="496" r="150" fill="hsl(253 85% 60%)" opacity="0.33"/>
  <circle cx="594" cy="291" r="195" fill="hsl(148 80% 65%)" opacity="0.30"/>
  <rect x="5" y="-100" width="120" height="1100" fill="#fff" opacity="0.07" transform="rotate(24 300 400)"/>
  <rect width="600" height="800" fill="url(#shade)"/>
  <g font-size="22" font-weight="700" letter-spacing="3">
    <rect x="40" y="44" width="234" height="40" rx="20" fill="hsl(253 90% 62%)"/>
    <text x="55" y="72" fill="#12081f">SUBSCRIPTION</text>
  </g>
  <g fill="#fff" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="52">
    <text x="40" y="562">PLAYSTATION</text>
    <text x="40" y="618">PLUS</text>
    <text x="40" y="674">ESSENTIAL 12</text>
    <text x="40" y="730">MONTHS</text>
  </g>
