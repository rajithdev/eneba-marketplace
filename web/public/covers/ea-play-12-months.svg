  <rect width="600" height="800" fill="url(#bg)"/>
  <circle cx="343" cy="434" r="123" fill="hsl(188 80% 65%)" opacity="0.21"/>
  <circle cx="208" cy="194" r="147" fill="hsl(343 85% 60%)" opacity="0.27"/>
  <circle cx="46" cy="287" r="107" fill="hsl(238 80% 65%)" opacity="0.30"/>
  <rect x="260" y="-100" width="120" height="1100" fill="#fff" opacity="0.07" transform="rotate(24 300 400)"/>
