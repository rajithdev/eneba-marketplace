  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <circle cx="502" cy="61" r="140" fill="hsl(21 80% 65%)" opacity="0.38"/>
  <circle cx="186" cy="325" r="98" fill="hsl(176 85% 60%)" opacity="0.24"/>
  <circle cx="315" cy="248" r="121" fill="hsl(71 80% 65%)" opacity="0.28"/>
  <rect x="289" y="-100" width="120" height="1100" fill="#fff" opacity="0.07" transform="rotate(24 300 400)"/>
