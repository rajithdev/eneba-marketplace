<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Sekiro: Shadows Die Twice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(261 70% 32%)"/>
      <stop offset="1" stop-color="hsl(327 75% 14%)"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.35" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.72"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <circle cx="320" cy="44" r="255" fill="hsl(286 80% 65%)" opacity="0.19"/>
  <circle cx="279" cy="97" r="217" fill="hsl(81 85% 60%)" opacity="0.26"/>
  <circle cx="404" cy="428" r="208" fill="hsl(336 80% 65%)" opacity="0.24"/>
  <rect x="-137" y="-100" width="120" height="1100" fill="#fff" opacity="0.07" transform="rotate(24 300 400)"/>
  <rect width="600" height="800" fill="url(#shade)"/>
  
  <g fill="#fff" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="57">
    <text x="40" y="606">SEKIRO:</text>
    <text x="40" y="668">SHADOWS DIE</text>
    <text x="40" y="730">TWICE</text>
  </g>
</svg>
