<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="The Legend of Zelda: Tears of the Kingdom">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(56 70% 32%)"/>
      <stop offset="1" stop-color="hsl(126 75% 14%)"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.35" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.72"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <circle cx="550" cy="95" r="201" fill="hsl(81 80% 65%)" opacity="0.26"/>
  <circle cx="40" cy="266" r="134" fill="hsl(236 85% 60%)" opacity="0.32"/>
  <circle cx="123" cy="405" r="194" fill="hsl(131 80% 65%)" opacity="0.18"/>
  <rect x="81" y="-100" width="120" height="1100" fill="#fff" opacity="0.07" transform="rotate(24 300 400)"/>
