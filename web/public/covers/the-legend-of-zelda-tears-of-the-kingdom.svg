  <g fill="#fff" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="52">
    <text x="40" y="562">THE LEGEND</text>
    <text x="40" y="618">OF ZELDA:</text>
    <text x="40" y="674">TEARS OF THE</text>
    <text x="40" y="730">KINGDOM</text>
