<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Sea of Thieves">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(309 70% 32%)"/>
      <stop offset="1" stop-color="hsl(1 75% 14%)"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.35" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.72"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <circle cx="141" cy="400" r="224" fill="hsl(334 80% 65%)" opacity="0.33"/>
  <circle cx="373" cy="150" r="115" fill="hsl(129 85% 60%)" opacity="0.37"/>
  <circle cx="152" cy="411" r="157" fill="hsl(24 80% 65%)" opacity="0.28"/>
  <rect x="1" y="-100" width="120" height="1100" fill="#fff" opacity="0.07" transform="rotate(24 300 400)"/>
  <rect width="600" height="800" fill="url(#shade)"/>
  
  <g fill="#fff" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="84">
    <text x="40" y="639">SEA OF</text>
    <text x="40" y="730">THIEVES</text>
  </g>
</svg>
