<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Elden Ring: Shadow of the Erdtree">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(185 70% 32%)"/>
      <stop offset="1" stop-color="hsl(249 75% 14%)"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.35" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.72"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <circle cx="383" cy="136" r="203" fill="hsl(210 80% 65%)" opacity="0.38"/>
  <circle cx="381" cy="354" r="208" fill="hsl(5 85% 60%)" opacity="0.20"/>
  <circle cx="215" cy="458" r="178" fill="hsl(260 80% 65%)" opacity="0.34"/>
  <rect x="84" y="-100" width="120" height="1100" fill="#fff" opacity="0.07" transform="rotate(24 300 400)"/>
  <rect width="600" height="800" fill="url(#shade)"/>
  <g font-size="22" font-weight="700" letter-spacing="3">
    <rect x="40" y="44" width="81" height="40" rx="20" fill="hsl(5 90% 62%)"/>
    <text x="55" y="72" fill="#12081f">DLC</text>
  </g>
  <g fill="#fff" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="57">
    <text x="40" y="606">ELDEN RING:</text>
    <text x="40" y="668">SHADOW OF</text>
    <text x="40" y="730">THE ERDTREE</text>
  </g>
</svg>
