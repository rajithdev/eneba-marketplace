  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <circle cx="557" cy="249" r="122" fill="hsl(60 80% 65%)" opacity="0.21"/>
  <circle cx="88" cy="182" r="236" fill="hsl(215 85% 60%)" opacity="0.34"/>
  <circle cx="445" cy="456" r="164" fill="hsl(110 80% 65%)" opacity="0.19"/>
  <rect x="-103" y="-100" width="120" height="1100" fill="#fff" opacity="0.07" transform="rotate(24 300 400)"/>
