<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Hades">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(60 70% 32%)"/>
      <stop offset="1" stop-color="hsl(141 75% 14%)"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.35" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.72"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <circle cx="419" cy="155" r="176" fill="hsl(85 80% 65%)" opacity="0.32"/>
  <circle cx="524" cy="1" r="152" fill="hsl(240 85% 60%)" opacity="0.22"/>
  <circle cx="572" cy="264" r="144" fill="hsl(135 80% 65%)" opacity="0.34"/>
  <rect x="-150" y="-100" width="120" height="1100" fill="#fff" opacity="0.07" transform="rotate(24 300 400)"/>
  <rect width="600" height="800" fill="url(#shade)"/>
  
  <g fill="#fff" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="84">
    <text x="40" y="730">HADES</text>
  </g>
</svg>
