<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Stardew Valley">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(229 70% 32%)"/>
      <stop offset="1" stop-color="hsl(290 75% 14%)"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.35" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.72"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <circle cx="300" cy="66" r="258" fill="hsl(254 80% 65%)" opacity="0.25"/>
  <circle cx="62" cy="368" r="243" fill="hsl(49 85% 60%)" opacity="0.27"/>
  <circle cx="97" cy="351" r="209" fill="hsl(304 80% 65%)" opacity="0.19"/>
  <rect x="37" y="-100" width="120" height="1100" fill="#fff" opacity="0.07" transform="rotate(24 300 400)"/>
  <rect width="600" height="800" fill="url(#shade)"/>
  
  <g fill="#fff" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="84">
    <text x="40" y="639">STARDEW</text>
    <text x="40" y="730">VALLEY</text>
  </g>
</svg>
