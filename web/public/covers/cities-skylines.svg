  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <circle cx="286" cy="489" r="251" fill="hsl(196 80% 65%)" opacity="0.29"/>
  <circle cx="596" cy="322" r="233" fill="hsl(351 85% 60%)" opacity="0.29"/>
  <circle cx="564" cy="209" r="234" fill="hsl(246 80% 65%)" opacity="0.24"/>
  <rect x="-69" y="-100" width="120" height="1100" fill="#fff" opacity="0.07" transform="rotate(24 300 400)"/>
  <rect width="600" height="800" fill="url(#shade)"/>
  
  <g fill="#fff" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="79">
    <text x="40" y="645">CITIES:</text>
